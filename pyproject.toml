[project]
name = "reports"
version = "0.1.0"
description = "Regulators' reports, roadmaps and masterplans (LPKSI, KEKSI, RP3SI, …), read and exported under Metamorph's market contract."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "metamorph-market-contract",
    "metamorph-pdf-text",  # the shared extraction: the text layer, and MinerU, the only OCR engine allowed
]

[project.scripts]
reports = "reports.cli:main"

[tool.uv.sources]
metamorph-contract = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-contract", editable = true }
metamorph-market-contract = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-market-contract", editable = true }
metamorph-pdf-text = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-pdf-text", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PLE"]
